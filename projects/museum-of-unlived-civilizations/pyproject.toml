[project]
name = "museum-of-unlived-civilizations"
version = "0.1.0"
description = "A single LangGraph curator agent that accumulates a coherent fictional material history, one artifact per iteration."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=2.0",
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
museum = "museum.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# UI katalog ikut terpasang: `museum serve` dan `museum export` membacanya dari paket.
museum = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
# SVG builders lean on implicit string concatenation; that is the point.
ignore = ["ISC004", "RUF001", "RUF002", "RUF003", "E501"]
